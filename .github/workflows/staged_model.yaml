name: Check staged model

on:
    repository_dispatch:
        types: [staged_model]

jobs:
    identify_event:
        runs-on: ubuntu-latest
        outputs:
            model_name: ${{ steps.set_output.outputs.model_name }}
        steps:
            - name: Check event type
              run: |
                echo "Event type: repository_dispatch"
                echo "Payload Data: ${{ toJson(github.event.client_payload) }}"

            - name: Setting model environment variable and output
              id: set_output
              run: |
                echo "model_name=${{ github.event.client_payload.artifact_version_string }}" >> $GITHUB_OUTPUT
                echo "model_entity=${{ github.event.client_payload.entity_name }}" >> $GITHUB_OUTPUT
                echo "model_project=${{ github.event.client_payload.project_name }}" >> $GITHUB_OUTPUT
            
            - name: Log GITHUB_OUTPUT
              run: cat $GITHUB_OUTPUT
              
    test_model_and_deploy:
        runs-on: ubuntu-latest
        needs: identify_event
        env:
            WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
            WANDB_ENTITY: ${{ needs.identify_event.outputs.model_entity }}
            WANDB_PROJECT: ${{ needs.identify_event.outputs.model_project }}
            MODEL_NAME: ${{ needs.identify_event.outputs.model_name }}
        steps:
        - name: Echo model name
          run: |
              echo "Model name: $MODEL_NAME"
        - name: Checkout code
          uses: actions/checkout@v4
  
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: 3.12
              cache: 'pip'
              cache-dependency-path: setup.py
  
        - name: Install dependencies
          run: |
              pip install -r requirements.txt
              pip list
  
        - name: Test model
          run: |
              pytest tests/test_model.py

        - name: Add production alias
          run: |
            python utils/link_model.py $MODEL_NAME -a production

        - name: Check folder models
          run: ls models
        
        - name: Authenticate with GCP
          uses: google-github-actions/auth@v2
          with:
              credentials_json: ${{ secrets.GOOGLE_CLOUD_SERVICE_KEY }}

        - name: Upload model
          uses: 'google-github-actions/upload-cloud-storage@v2'
          with:
            path: '/models/football_segmentation_model.pth'
            destination: 'segmentation-model-football'

        - name: Deploy API 
          run: |
            gcloud builds submit --config=cloudbuild_api.yaml
